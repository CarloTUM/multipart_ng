[package]
name = "multipart_ng"
version = "0.18.1"
authors = [
    "Austin Bonander <austin.bonander@gmail.com>",
    "Carlo Deutschmann <deutschmanncarlo@gmail.com>",
]
description = "Maintained drop-in fork of `multipart` 0.18.0: client- and server-side multipart/form-data (HTTP file upload) handling with a synchronous std::io API. Fixes the trailing_semicolon_in_macro future-incompatibility warning."
documentation = "https://docs.rs/multipart_ng"
readme = "README.md"
keywords = ["multipart", "form-data", "upload", "http", "file-upload"]
categories = ["web-programming::http-server", "web-programming::http-client", "parser-implementations"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/CarloTUM/multipart_ng"

[[bin]]
name = "form_test"
required-features = ["mock", "hyper", "server"]

[[example]]
name = "hyper_client"
required-features = ["client", "mock", "hyper"]

[[example]]
name = "hyper_reqbuilder"
required-features = ["client", "mock", "hyper"]

[[example]]
name = "hyper_server"
required-features = ["mock", "hyper", "server"]

[[example]]
name = "iron"
required-features = ["mock", "iron", "server"]

[[example]]
name = "iron_intercept"
required-features = ["mock", "iron", "server"]

[[example]]
name = "nickel"
required-features = ["mock", "nickel", "server"]

[[example]]
name = "tiny_http"
required-features = ["mock", "tiny_http", "server"]

[[example]]
name = "rocket"
required-features = ["mock", "rocket", "server"]
[dependencies.buf_redux]
package = "buf_redux_ng"
version = "0.8.4"
optional = true
default-features = false

[dependencies.clippy]
version = ">=0.0, <0.1"
optional = true

[dependencies.httparse]
version = "1.2"
optional = true

[dependencies.hyper]
version = ">=0.9, <0.11"
optional = true
default-features = false

[dependencies.iron]
version = ">=0.4,<0.7"
optional = true

[dependencies.lazy_static]
version = "1.2.0"
optional = true

[dependencies.log]
version = "0.4"

[dependencies.memchr]
version = "2.4"
optional = true

[dependencies.mime]
version = "0.3.14"

[dependencies.mime_guess]
version = "2.0.1"

[dependencies.nickel]
version = ">=0.10.1"
optional = true

[dependencies.quick-error]
version = "1.2"
optional = true

[dependencies.rand]
version = "0.8"

[dependencies.rocket]
version = "0.4"
optional = true

[dependencies.tempfile]
version = "3"

[dependencies.tiny_http]
version = "0.6"
optional = true

[dev-dependencies.env_logger]
version = "0.5"

[features]
bench = []
client = []
default = ["client", "hyper", "iron", "mock", "nickel", "server", "tiny_http"]
mock = []
nightly = []
server = ["buf_redux", "httparse", "memchr", "quick-error"]
